[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-url-shortener"
version = "0.1.0"
description = "A governed agentic engineering workflow and URL shortener prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentic-shortener = "shortener.cli:main"

[tool.setuptools.packages.find]
include = ["shortener*"]
